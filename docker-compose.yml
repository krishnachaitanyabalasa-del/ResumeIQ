version: '3.8'

services:
  # 1. MYSQL DATABASE SERVICE
  db:
    image: mysql:8.0
    container_name: resumeiq-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ResumeIQ
      MYSQL_ROOT_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-changeit}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # 2. SPRING BOOT BACKEND SERVICE
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resumeiq-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/ResumeIQ?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-root}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-changeit}
      # MULTI-API KEY ROTATION & QUOTA FAILOVER KEYS
      - GOOGLE_API_KEYS=${GOOGLE_API_KEYS:-}
      - GOOGLE_API_KEY1=${GOOGLE_API_KEY1:-}
      - GOOGLE_API_KEY2=${GOOGLE_API_KEY2:-}
      - GOOGLE_API_KEY3=${GOOGLE_API_KEY3:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads

volumes:
  mysql_data:

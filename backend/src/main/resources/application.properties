server.port=${SERVER_PORT:8080}

spring.application.name=resumeiq-backend

# MySQL Datasource Configuration (Configurable via Environment Variables or defaults)
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ResumeIQ?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:chaitu}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:A11@CHAITU143}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configurations
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

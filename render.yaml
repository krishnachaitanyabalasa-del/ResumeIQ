# =========================================================
# RENDER BLUEPRINT FOR RESUMEIQ SPRING BOOT BACKEND
# =========================================================

services:
  - type: web
    name: resumeiq-backend
    env: java
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/resumeiq-backend-0.0.1-SNAPSHOT.jar
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: SERVER_PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: GOOGLE_API_KEYS
        sync: false
